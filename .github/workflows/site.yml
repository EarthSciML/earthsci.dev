name: Build and deploy site

# Assembles every project's docs bundle (the `docs-bundle` branch of each
# source repo) with the intro/quick-start pages here, builds with Hugo, and
# deploys to GitHub Pages. See DESIGN.md.

on:
  repository_dispatch:
    types: [docs-updated]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deployment at a time; never cancel a running production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUGO_VERSION: "0.131.0"
      PAGEFIND_VERSION: "1.1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tool tests
        run: python -m unittest discover -s tests

      - name: Summarize trigger
        env:
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          {
            echo "### Site build"
            if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
              echo "Triggered by docs update in **${PAYLOAD_REPO}** at \`${PAYLOAD_SHA:0:8}\`."
            else
              echo "Triggered by \`${GITHUB_EVENT_NAME}\` on this repository."
            fi
            echo "All projects' latest \`docs-bundle\` branches are fetched on every build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and assemble project docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_FETCH_TOKEN || github.token }}
        run: python tools/assemble.py

      - name: Install Hugo extended
        run: |
          curl -sSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin hugo

      - name: Build site
        run: hugo --minify --destination public

      - name: Build Pagefind search index
        run: npx --yes "pagefind@${PAGEFIND_VERSION}" --site public

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/public
            --exclude '^https?://'
            --exclude '^mailto:'
            'public/**/*.html'
          fail: true
          format: detailed

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
