name: Build and publish docs bundle
description: >-
  Render the API reference (if the repo has docs/api/config.toml), build this
  repo's docs bundle, and, on a push to the default branch, publish it to the
  `docs-bundle` branch and tell EarthSciML/earthsci.dev to rebuild the site.
  Run after checkout, any prebuild steps (docs/site.toml `prebuild`), and
  actions/download-artifact for the api-docs-* artifacts. See DESIGN.md in
  EarthSciML/earthsci.dev.

inputs:
  dispatch-token:
    description: Token allowed to send repository_dispatch to the site repo (SITE_DISPATCH_TOKEN). Empty disables the dispatch.
    required: false
    default: ''
  publish:
    description: >-
      Push the bundle branch and dispatch. `auto` publishes only on a push to
      the default branch; `true`/`false` force it.
    required: false
    default: auto
  strict:
    description: Pass --strict to render.py (warnings fail the build).
    required: false
    default: 'false'
  site-repo:
    description: The site repository to notify.
    required: false
    default: EarthSciML/earthsci.dev
  python-version:
    description: Python used for the bundle tools (3.11 or newer).
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Render API reference
      shell: bash
      env:
        STRICT: ${{ inputs.strict }}
      run: |
        if [[ -f docs/api/config.toml ]]; then
          args=(--repo-root .)
          [[ "$STRICT" == "true" ]] && args+=(--strict)
          python "$GITHUB_ACTION_PATH/../../../tools/api_docs/render.py" "${args[@]}"
        else
          echo "no docs/api/config.toml; skipping API reference"
        fi

    - name: Build bundle
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../../tools/bundle.py" --repo-root . --out "$RUNNER_TEMP/docs-bundle"

    - name: Decide whether to publish
      id: decide
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        publish=false
        if [[ "$PUBLISH" == "true" ]]; then
          publish=true
        elif [[ "$PUBLISH" == "auto" && "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
          publish=true
        fi
        echo "publish=$publish" >> "$GITHUB_OUTPUT"

    - name: Upload bundle (inspection / PR validation)
      if: steps.decide.outputs.publish != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: docs-bundle
        path: ${{ runner.temp }}/docs-bundle
        retention-days: 3

    # The bundle goes to an orphan branch of the source repo itself, using the
    # job's own token (the job needs `contents: write`). The site build then
    # fetches this branch from every project, so it never depends on which
    # repo triggered it.
    - name: Publish docs-bundle branch
      if: steps.decide.outputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/docs-bundle"
        git init -q -b docs-bundle .
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "docs bundle for ${GITHUB_SHA}"
        git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" docs-bundle:docs-bundle

    - name: Notify earthsci.dev
      if: steps.decide.outputs.publish == 'true' && inputs.dispatch-token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.dispatch-token }}
        SITE_REPO: ${{ inputs.site-repo }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        id=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$RUNNER_TEMP/docs-bundle/bundle.json")
        curl -fsS -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${SITE_REPO}/dispatches" \
          -d "$(python -c "import json,os; print(json.dumps({'event_type':'docs-updated','client_payload':{'id':'$id','repo':os.environ['REPO'],'sha':os.environ['GITHUB_SHA']}}))")"

    - name: Warn when the dispatch token is missing
      if: steps.decide.outputs.publish == 'true' && inputs.dispatch-token == ''
      shell: bash
      run: echo "::warning::SITE_DISPATCH_TOKEN is not set; the docs bundle was published but earthsci.dev was not notified."
